name: Weekly menu

on:
  schedule:
    # 03:20 UTC Monday. This is 04:20 in Swiss winter time and 05:20 in summer time.
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-menu-pages
  cancel-in-progress: true

jobs:
  build-menu:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download, process, and render menu
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: ./Get-SvWeeklyMenu.ps1 -OutputDirectory ./public

      - name: Save generated website
        uses: actions/upload-artifact@v4
        with:
          name: menu-site
          path: ./public
          if-no-files-found: error
          retention-days: 1

  publish-pages:
    needs: build-menu
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download generated website
        uses: actions/download-artifact@v4
        with:
          name: menu-site
          path: ./public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
